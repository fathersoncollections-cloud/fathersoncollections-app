<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#70CCF5">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="FatherSon">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="Our collection, sorted.">
  <title>FatherSon Collections</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #70CCF5;
      color: #13294B;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    #appFrame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #70CCF5;
    }
    #loading, #fallback {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 24px;
      text-align: center;
      background: #70CCF5;
      z-index: 2;
    }
    #fallback { display: none; }
    #loading img, #fallback img { width: 120px; height: 120px; }
    h1 { font-size: 22px; margin: 0; }
    p { margin: 0; font-size: 16px; line-height: 1.4; max-width: 28em; }
    a.btn {
      display: inline-block;
      margin-top: 8px;
      background: #FED90F;
      color: #13294B;
      font-weight: 800;
      text-decoration: none;
      border: 3px solid #13294B;
      border-radius: 14px;
      padding: 12px 18px;
    }
    .spinner {
      width: 28px; height: 28px;
      border: 4px solid #13294B;
      border-top-color: #FED90F;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <img src="icons/icon-192.png" alt="">
    <h1>FatherSon Collections</h1>
    <div class="spinner" aria-hidden="true"></div>
    <p>Opening your collection…</p>
  </div>
  <div id="fallback">
    <img src="icons/icon-192.png" alt="">
    <h1>FatherSon Collections</h1>
    <p>The collection couldn’t load inside this page yet. Open it directly, or try again after the latest app update is live.</p>
    <a class="btn" id="openDirect" href="https://script.google.com/a/gmail.com/macros/s/AKfycbwSO6lF3RuWl0oihI0plwrpb2UKTVDG699nbfXpsiD9y-ZIlRxf44L4SZgw7whRzpeF/exec">Open the collection</a>
  </div>
  <iframe
    id="appFrame"
    title="FatherSon Collections"
    src="https://script.google.com/a/gmail.com/macros/s/AKfycbwSO6lF3RuWl0oihI0plwrpb2UKTVDG699nbfXpsiD9y-ZIlRxf44L4SZgw7whRzpeF/exec"
    allow="camera; microphone; clipboard-write; fullscreen; geolocation"
    referrerpolicy="no-referrer-when-downgrade">
  </iframe>
  <script>
    (function () {
      var APP = 'https://script.google.com/a/gmail.com/macros/s/AKfycbwSO6lF3RuWl0oihI0plwrpb2UKTVDG699nbfXpsiD9y-ZIlRxf44L4SZgw7whRzpeF/exec';
      if (location.search.indexOf('stub=1') !== -1) {
        APP = './app-stub.html';
        document.getElementById('appFrame').src = APP;
        document.getElementById('openDirect').href = APP;
      }
      var loading = document.getElementById('loading');
      var fallback = document.getElementById('fallback');
      var frame = document.getElementById('appFrame');
      var loaded = false;
      frame.addEventListener('load', function () {
        loaded = true;
        loading.style.display = 'none';
      });
      setTimeout(function () {
        if (!loaded) {
          loading.style.display = 'none';
          fallback.style.display = 'flex';
        }
      }, 20000);
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js');
      }
    })();
  </script>
</body>
</html>
