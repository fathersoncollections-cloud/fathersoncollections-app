<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#70CCF5">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="FatherSon">
  <meta name="description" content="Our collection, sorted.">
  <meta name="referrer" content="no-referrer">
  <title>FatherSon Collections</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root {
    --sky: #9FD3E6; --skyL: #E6F4F8; --yel: #FFD36E; --pink: #F4A0B5; --pinkL: #FCE1E8;
    --ink: #13294B; --green: #7BD389; --amber: #FFB347; --red: #E4572E; --white: #FFFFFF;
    --r: 20px; --tap: 52px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink); background: var(--sky); font-size: 17px; line-height: 1.4;
    min-height: 100vh; padding-bottom: calc(84px + env(safe-area-inset-bottom));
  }
  #sky { position: fixed; inset: 0; z-index: -1; background: var(--sky); overflow: hidden; }
  #sky svg { width: 100%; height: 100%; }
  header#topbar {
    position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between;
    gap: 8px; padding: calc(8px + env(safe-area-inset-top)) 12px 8px; background: var(--yel); border-bottom: 4px solid var(--ink);
  }
  .brand { display: flex; align-items: center; gap: 8px; background: none; border: 0; padding: 0; color: var(--ink); text-align: left; min-height: var(--tap); cursor: pointer; }
  .logo { width: 46px; height: 46px; display: block; flex: 0 0 auto; }
  .logo svg { width: 100%; height: 100%; }
  .brandText { display: flex; flex-direction: column; font-weight: 900; font-size: 19px; line-height: 1.1; }
  .brandText small { font-weight: 700; font-size: 13px; opacity: .8; }
  .stuck { min-height: 44px; border-radius: 999px; border: 3px solid var(--ink); background: var(--white); color: var(--ink); font-weight: 800; font-size: 15px; padding: 6px 12px; }
  main { max-width: 760px; margin: 0 auto; padding: 14px 12px 20px; outline: none; }
  h1 { font-size: 26px; margin: 6px 0 12px; font-weight: 900; }
  h2 { font-size: 21px; margin: 4px 0 10px; font-weight: 900; }
  h3 { font-size: 18px; margin: 4px 0 6px; font-weight: 900; }
  p { margin: 6px 0; }
  .card { background: var(--white); border: 4px solid var(--ink); border-radius: var(--r); padding: 16px; margin: 0 0 14px; }
  .card.yel { background: var(--yel); } .card.skyL { background: var(--skyL); } .card.pinkL { background: var(--pinkL); } .card.pink { background: var(--pink); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 14px; }
  .tile { display: flex; flex-direction: column; gap: 8px; margin: 0; }
  .tile .head { font-size: 18px; font-weight: 900; }
  .big { font-size: 40px; font-weight: 900; line-height: 1; }
  .hint { font-size: 15px; opacity: .85; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--tap);
    padding: 10px 18px; border-radius: 999px; border: 3px solid var(--ink); background: var(--white); color: var(--ink);
    font-weight: 900; font-size: 17px; text-decoration: none; cursor: pointer; text-align: center;
  }
  .btn.main { background: var(--ink); color: var(--white); }
  .btn.yel { background: var(--yel); } .btn.green { background: var(--green); } .btn.pink { background: var(--pink); }
  .btn.full { width: 100%; }
  .btn.small { min-height: 44px; font-size: 15px; padding: 6px 14px; }
  .btn:disabled { opacity: .5; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .stack { display: flex; flex-direction: column; gap: 10px; }
  input[type=text], input[type=search], input[type=number], input[type=password], select, textarea {
    width: 100%; min-height: var(--tap); font-size: 17px; padding: 10px 14px; border: 3px solid var(--ink);
    border-radius: 14px; background: var(--white); color: var(--ink); font-family: inherit;
  }
  textarea { min-height: 96px; }
  label.field { display: block; font-weight: 800; margin: 10px 0 4px; }
  .search { position: relative; margin: 0 0 14px; }
  .filters { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; margin: 0 0 12px; background: var(--white); border: 3px solid var(--ink); border-radius: 16px; padding: 4px 12px 12px; }
  .filters[hidden] { display: none; }
  .filters label.field { margin: 8px 0 2px; font-size: 14px; }
  .filters select { font-size: 15px; padding: 6px 8px; width: 100%; }
  select.inline { width: auto; flex: 1 1 140px; min-height: 44px; font-size: 15px; padding: 6px 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(46%, 160px), 1fr)); gap: 10px; }
  .gcard { background: var(--white); border: 3px solid var(--ink); border-radius: 16px; overflow: hidden; padding: 0; text-align: left; color: var(--ink); cursor: pointer; display: flex; flex-direction: column; font-family: inherit; }
  .thumb { width: 100%; aspect-ratio: 1 / 1; background: var(--skyL); display: flex; align-items: center; justify-content: center; font-size: 30px; overflow: hidden; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* v6: share, price check, history, badges */
  .sharePrev { display: block; width: 100%; max-width: 360px; margin: 0 auto 8px; border-radius: 14px; border: 3px solid var(--ink); }
  .row.wrap { flex-wrap: wrap; } .row.wrap .btn { flex: 1 1 45%; text-align: center; }
  .timeline { position: relative; }
  .tlMonth h2 { position: sticky; top: 0; background: var(--sky); padding: 6px 0; z-index: 2; margin: 14px 0 6px; }
  .tlRow { position: relative; } .tlRow .grow, .li .grow { text-align: left; } .tlMeta { color: #2d4a73; }
  .tlDot { width: 12px; height: 12px; border-radius: 50%; background: var(--yel); border: 3px solid var(--ink); flex: 0 0 12px; }
  .kbig.kwide { grid-column: 1 / -1; } .kbig.pinkL { background: var(--pinkL); }
  .badgeWall { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .badge { background: #eef1f4; border: 3px dashed #9aa7b8; border-radius: 18px; padding: 12px 8px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 2px; color: #55657a; }
  .badge .bIc { font-size: 40px; filter: grayscale(1); opacity: .55; }
  .badge b { font-size: 16px; line-height: 1.15; } .badge small { font-size: 12px; line-height: 1.2; } .badge em { font-style: normal; font-weight: 900; font-size: 13px; }
  .badge.got { background: var(--yel); border: 3px solid var(--ink); color: var(--ink); box-shadow: 0 4px 0 var(--ink); }
  .badge.got .bIc { filter: none; opacity: 1; animation: bPop .5s ease-out; }
  .bBar { width: 80%; height: 8px; background: #d5dbe3; border-radius: 4px; overflow: hidden; margin-top: 4px; } .bBar i { display: block; height: 100%; background: var(--green); }
  .badgeBig { font-size: 84px; text-align: center; animation: bPop .6s ease-out; }
  @keyframes bPop { 0% { transform: scale(.3) rotate(-20deg); } 70% { transform: scale(1.15) rotate(6deg); } 100% { transform: scale(1); } }
  .confetti { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 9999; }
  /* v5: photo loading + tap to retry */
  .thWait { width: 34%; max-width: 40px; aspect-ratio: 1 / 1; border-radius: 50%; border: 4px solid rgba(0,0,0,.08); border-top-color: var(--sky, #4aa3df); animation: thSpin 0.9s linear infinite; }
  .li .thWait { width: 22px; border-width: 3px; }
  @keyframes thSpin { to { transform: rotate(360deg); } }
  .thRetry { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; font-size: 28px; font-weight: 900; color: #555; background: repeating-linear-gradient(45deg, rgba(0,0,0,.03) 0 8px, transparent 8px 16px); cursor: pointer; }
  .thRetry small { font-size: 12px; font-weight: 800; margin-top: 2px; }
  .li .thRetry { font-size: 18px; } .li .thRetry small { display: none; }
  .thNone { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; color: #6b7c87; background: repeating-linear-gradient(-45deg, rgba(255,255,255,.35) 0 10px, transparent 10px 20px); }
  .thNone small { font-size: 12px; font-weight: 800; margin-top: 4px; letter-spacing: .2px; }
  .li .thNone small { display: none; }
  .ktile .thNone small { font-size: 14px; }
  .gname { padding: 8px 10px 10px; font-weight: 800; font-size: 14px; line-height: 1.25; }
  .gmeta { display: block; font-weight: 600; font-size: 12px; opacity: .75; margin-top: 2px; }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 999px; border: 2px solid var(--ink); background: var(--white); font-size: 13px; font-weight: 800; }
  .pill.green { background: var(--green); } .pill.amber { background: var(--amber); } .pill.red { background: var(--red); color: var(--white); } .pill.yel { background: var(--yel); }
  .bar { height: 20px; background: var(--white); border: 3px solid var(--ink); border-radius: 999px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--green); }
  .facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 16px; }
  .facts dt { font-weight: 800; } .facts dd { margin: 0; word-break: break-word; }
  .hero { width: 100%; border-radius: 16px; border: 3px solid var(--ink); background: var(--skyL); aspect-ratio: 4 / 3; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .hero img { width: 100%; height: 100%; object-fit: contain; background: var(--white); }
  .strip { display: flex; gap: 8px; overflow-x: auto; padding: 8px 0; }
  .strip a { flex: 0 0 72px; height: 72px; border: 2px solid var(--ink); border-radius: 10px; overflow: hidden; display: flex; align-items: center; justify-content: center; background: var(--skyL); text-decoration: none; }
  .strip img { width: 100%; height: 100%; object-fit: cover; }
  .nudge { background: var(--pinkL); border: 3px dashed var(--ink); border-radius: 16px; padding: 12px; margin: 10px 0; font-weight: 700; }
  .warn { background: #FFF3C4; border: 3px solid var(--ink); border-radius: 16px; padding: 12px; margin: 10px 0; }
  .list { display: flex; flex-direction: column; gap: 10px; }
  .li { display: flex; align-items: center; gap: 10px; background: var(--white); border: 3px solid var(--ink); border-radius: 16px; padding: 10px 12px; }
  .li .grow { flex: 1 1 auto; min-width: 0; font-weight: 800; }
  .li .grow small { display: block; font-weight: 600; opacity: .75; }
  .steps { display: flex; gap: 6px; margin: 0 0 12px; }
  .steps span { flex: 1; height: 10px; border-radius: 999px; background: var(--white); border: 2px solid var(--ink); }
  .steps span.on { background: var(--ink); }
  .choice { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  .choice .btn.sel { background: var(--yel); box-shadow: inset 0 0 0 3px var(--ink); }
  .shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 8px; margin: 10px 0; }
  .shot { position: relative; border: 3px solid var(--ink); border-radius: 12px; overflow: hidden; aspect-ratio: 1/1; background: var(--skyL); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; text-align: center; }
  .shot img { width: 100%; height: 100%; object-fit: cover; }
  .shot b { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,.9); font-size: 12px; padding: 2px; }
  .guide { text-align: center; }
  .guide .mascot { width: 140px; margin: 0 auto 6px; }
  .dots { display: flex; justify-content: center; gap: 8px; margin: 12px 0; }
  .dots span { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--ink); background: var(--white); }
  .dots span.on { background: var(--ink); }
  table.tbl { width: 100%; border-collapse: collapse; font-size: 15px; }
  table.tbl th, table.tbl td { text-align: left; padding: 8px 6px; border-bottom: 2px solid var(--skyL); vertical-align: top; }
  table.tbl td.num, table.tbl th.num { text-align: right; white-space: nowrap; }
  nav#tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: space-around;
    background: var(--white); border-top: 4px solid var(--ink); padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
  }
  nav#tabbar button { flex: 1; min-height: 58px; background: none; border: 0; color: var(--ink); font-weight: 800; font-size: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 14px; font-family: inherit; }
  nav#tabbar button .ic { font-size: 24px; line-height: 1; }
  nav#tabbar button[aria-current=page] { background: var(--yel); }
  .sheet { position: fixed; inset: 0; z-index: 50; background: rgba(19,41,75,.55); display: flex; align-items: flex-end; justify-content: center; }
  .sheet[hidden] { display: none; }
  .sheetCard { width: 100%; max-width: 620px; max-height: 88vh; overflow-y: auto; background: var(--white); border: 4px solid var(--ink); border-bottom: 0; border-radius: 24px 24px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); }
  .toast { position: fixed; left: 12px; right: 12px; bottom: calc(92px + env(safe-area-inset-bottom)); z-index: 60; max-width: 620px; margin: 0 auto; background: var(--ink); color: var(--white); border-radius: 16px; padding: 14px 16px; font-weight: 700; text-align: center; }
  .toast.good { background: #1E6B3A; } .toast.oops { background: #8A3A12; }
  .busy { position: fixed; inset: 0; z-index: 70; background: rgba(255,255,255,.7); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; font-weight: 800; }
  .busy[hidden], .toast[hidden] { display: none; }
  .spinner { width: 54px; height: 54px; border: 7px solid var(--skyL); border-top-color: var(--ink); border-radius: 50%; animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .foot { text-align: center; font-size: 13px; opacity: .85; margin: 18px 0 0; }
  .muted { opacity: .7; }
  .center { text-align: center; }
  @media (min-width: 700px) { .grid { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); } }
  /* v2 */
  .gcard { position: relative; }
  .gcard .badge { position: absolute; top: 6px; right: 6px; background: var(--yel); border: 2px solid var(--ink); border-radius: 999px; font-size: 14px; padding: 1px 6px; }
  .li .thumb { width: 56px; height: 56px; flex: 0 0 56px; border-radius: 10px; font-size: 20px; }
  .linkish { background: none; border: 0; padding: 0; color: var(--ink); font: inherit; font-weight: 800; text-decoration: underline; cursor: pointer; }
  .menu { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .mtile { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left; background: var(--white); border: 4px solid var(--ink); border-radius: 20px; padding: 14px; color: var(--ink); font-family: inherit; cursor: pointer; min-height: 120px; }
  .mtile:nth-child(4n+1) { background: var(--yel); } .mtile:nth-child(4n+2) { background: var(--skyL); } .mtile:nth-child(4n+3) { background: var(--pinkL); }
  .mtile .mic { font-size: 30px; line-height: 1; } .mtile b { font-size: 17px; font-weight: 900; } .mtile small { font-size: 13px; opacity: .8; font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; min-height: 40px; padding: 4px 12px; border-radius: 999px; border: 3px solid var(--ink); background: var(--white); color: var(--ink); font-weight: 800; font-size: 14px; font-family: inherit; cursor: pointer; }
  .chip.on { background: var(--green); }
  span.chip { cursor: default; min-height: 32px; }
  .hero { position: relative; cursor: zoom-in; }
  .hero .zoom { position: absolute; bottom: 8px; right: 8px; background: rgba(255,255,255,.9); border: 2px solid var(--ink); border-radius: 999px; padding: 2px 10px; font-size: 13px; font-weight: 800; }
  .gallery .hint { grid-column: 1 / -1; }
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; margin-bottom: 14px; }
  .gthumb { position: relative; aspect-ratio: 1 / 1; padding: 0; border: 3px solid var(--ink); border-radius: 12px; overflow: hidden; background: var(--skyL); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 26px; }
  .gthumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .gthumb.main { border-color: var(--yel); box-shadow: 0 0 0 3px var(--ink); }
  .gthumb b { position: absolute; left: 4px; bottom: 4px; background: var(--yel); border: 2px solid var(--ink); border-radius: 999px; font-size: 11px; padding: 0 6px; }
  .gthumb i { position: absolute; right: 4px; top: 4px; font-style: normal; font-size: 14px; background: var(--white); border-radius: 999px; padding: 0 5px; }
  .lightbox { position: fixed; inset: 0; z-index: 80; background: rgba(19,41,75,.92); display: flex; align-items: center; justify-content: center; padding: 12px; }
  .lightbox[hidden] { display: none; }
  .lbInner { width: 100%; max-width: 760px; display: flex; flex-direction: column; gap: 10px; }
  .lbImg { background: var(--white); border-radius: 16px; overflow: hidden; display: flex; align-items: center; justify-content: center; max-height: 70vh; min-height: 200px; }
  .lbImg img { max-width: 100%; max-height: 70vh; object-fit: contain; display: block; }
  .lbName { color: var(--white); font-weight: 700; font-size: 14px; text-align: center; word-break: break-word; }
  .lbBtns { justify-content: center; }
  #tour { position: fixed; inset: 0; z-index: 90; }
  #tour[hidden] { display: none; }
  #tour.dim { background: rgba(19,41,75,.6); }
  .tHole { position: fixed; border-radius: 16px; box-shadow: 0 0 0 9999px rgba(19,41,75,.6); border: 4px solid var(--yel); pointer-events: none; transition: all .25s; }
  .tBubble { position: fixed; left: 12px; right: 12px; max-width: 520px; margin: 0 auto; background: var(--white); border: 4px solid var(--ink); border-radius: 20px; padding: 16px; box-shadow: 0 8px 0 var(--ink); }
  .tBubble.center { top: 50%; transform: translateY(-50%); } .tBubble.top { top: calc(80px + env(safe-area-inset-top)); } .tBubble.bottom { bottom: calc(110px + env(safe-area-inset-bottom)); }
  .tStep { font-size: 13px; font-weight: 800; opacity: .7; }
  .hbars { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
  .hb { display: grid; grid-template-columns: minmax(90px, 38%) 1fr auto; gap: 8px; align-items: center; font-size: 14px; }
  .hbL { font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hbT { height: 16px; background: var(--skyL); border: 2px solid var(--ink); border-radius: 999px; overflow: hidden; }
  .hbF { display: block; height: 100%; background: var(--yel); }
  .hbV { font-weight: 900; min-width: 2.5em; text-align: right; }
  .vbars { display: flex; align-items: flex-end; gap: 6px; height: 180px; padding-top: 10px; overflow-x: auto; }
  .vb { flex: 1 0 34px; display: flex; flex-direction: column; align-items: center; height: 100%; gap: 3px; font-size: 11px; font-weight: 800; }
  .vbT { flex: 1; width: 70%; display: flex; align-items: flex-end; background: var(--skyL); border-radius: 8px 8px 0 0; }
  .vbF { width: 100%; background: var(--pink); border: 2px solid var(--ink); border-radius: 8px 8px 0 0; display: block; }
  .vbL { white-space: nowrap; }
  .rings { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .ring { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; }
  .ring svg { width: 110px; height: 110px; background: var(--skyL); border-radius: 50%; }
  .faq summary { font-weight: 900; font-size: 18px; cursor: pointer; list-style: none; }
  .faq summary::-webkit-details-marker { display: none; }
  .faq summary::after { content: ' \25BE'; }
  .faq ul { margin: 8px 0 0; padding-left: 20px; } .faq li { margin: 4px 0; }
  .mascot.small { width: 90px; margin: 0 auto; }

  .pinCard { max-width: 360px; margin-left: auto; margin-right: auto; }
  .pinDots { display: flex; justify-content: center; gap: 14px; margin: 16px 0 8px; }
  .pinDot { width: 18px; height: 18px; border-radius: 50%; border: 3px solid var(--ink); background: transparent; display: inline-block; }
  .pinDot.on { background: var(--ink); }
  .pinDot.bad { border-color: var(--red); background: var(--red); }
  .pinDot.bad.on { background: var(--red); }
  .pinErr { color: var(--red); font-weight: 800; min-height: 1.4em; }
  .pinPad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 12px 0 16px; }
  .pinKey { min-height: 64px; border-radius: 18px; border: 3px solid var(--ink); background: var(--white); color: var(--ink);
    font-weight: 900; font-size: 26px; cursor: pointer; }
  .pinKey:disabled { opacity: .5; }

  .pinCard.bad .pinDots { animation: pinShake 0.35s ease-in-out; }
  @keyframes pinShake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

  /* ---- v4: Do I own it?, value, deals, offline bar, scanner, Son's mode ---- */
  .ownCard { background: var(--white); }
  .ownLabel { display: block; font-size: 22px; font-weight: 900; margin-bottom: 8px; }

  /* ---- v7i: Springfield sky + pinned note / letter frame ---- */
  .letterWrap, .noteWrap { background: #70CCF5; }

    position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
  }
  .letterSky svg { width: 100%; height: 100%; display: block; }
  .letterFrame, .noteFrame {
    position: relative; z-index: 1;
    width: 100%; margin: auto;

    flex: 0 1 auto; min-height: 0; max-height: 100%;
    box-sizing: border-box;
  }
  .letterFrame { max-width: 520px; }
  .noteFrame { max-width: 360px; transform: rotate(-1.6deg); }
  .letterWrap.popIn .letterFrame { animation: cardPop .45s cubic-bezier(.2, 1.4, .3, 1) both; }
  .noteWrap.popIn .noteFrame { animation: notePop .5s cubic-bezier(.2, 1.4, .3, 1) both; }
  @keyframes cardPop {
    0% { transform: scale(.84); opacity: 0; }
    60% { transform: scale(1.04); opacity: 1; }
    100% { transform: scale(1); }
  }
  @keyframes notePop {
    0% { transform: rotate(-1.6deg) scale(.78); opacity: 0; }
    58% { transform: rotate(-1.6deg) scale(1.07); opacity: 1; }
    100% { transform: rotate(-1.6deg) scale(1); }

    position: absolute; top: -12px; left: 50%; width: 86px; height: 28px;
    margin-left: -43px; background: rgba(255, 236, 170, .78);
    border: 2px solid rgba(19,41,75,.18); transform: rotate(-3deg);
    box-shadow: 0 2px 0 rgba(19,41,75,.08); z-index: 3; pointer-events: none;
  }
  .notePin {
    position: absolute; top: -10px; left: 22px; width: 16px; height: 16px;
    background: #E4572E; border: 3px solid #13294B; border-radius: 50%;
    box-shadow: 0 3px 0 #13294B; z-index: 4; pointer-events: none;
  }
  .notePin::after {
    content: ""; position: absolute; left: 5px; top: 12px; width: 3px; height: 12px;
    background: #8899aa; border-radius: 1px;
  }
  .noteDonut {
    position: absolute; top: -16px; right: -12px; width: 52px; height: 52px;
    border-radius: 50%; background:
      radial-gradient(circle at center, #FBF6E8 0 9px, transparent 10px),
      #F4A0B5;
    border: 3px solid #13294B; box-shadow: 0 3px 0 #13294B;
    z-index: 4; pointer-events: none; transform: rotate(12deg);
  }
  .noteDonut::before, .noteDonut::after {
    content: ""; position: absolute; border-radius: 2px; pointer-events: none;
  }
  .noteDonut::before {
    width: 8px; height: 3px; background: #FED90F; top: 12px; left: 10px; transform: rotate(-30deg);
    box-shadow: 16px 6px 0 #1A3A9C, 8px 18px 0 #fff, 22px 16px 0 #FED90F, 4px 26px 0 #E4572E;
  }
  .noteDonut::after {
    width: 8px; height: 3px; background: #1A3A9C; top: 22px; right: 10px; transform: rotate(40deg);
    box-shadow: -14px -8px 0 #E4572E, -4px 12px 0 #FED90F, -18px 8px 0 #fff;
